# Exports a fresh snapshot from the database, builds the static frontend
# (vite --mode static) and publishes it to GitHub Pages.
#
# Publish = run this workflow: Actions → "Deploy to GitHub Pages" → Run workflow
# (or `npm run publish:site`). Pushes to main that touch the app deploy too.
# Needs the DATABASE_URL repository secret.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/src/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      # Snapshot straight from the database into frontend/public/data
      - run: npm ci
        working-directory: backend
      - run: npm run export:static
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # configure-pages reports the base path without a trailing slash; Vite needs one.
      - run: npm ci
        working-directory: frontend
      - run: npm run build:static
        working-directory: frontend
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
